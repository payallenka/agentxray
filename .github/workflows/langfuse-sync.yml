# A daily roll-up of yesterday's agent runs.
#
# Deliberately daily, not continuous. Runscan is a post-hoc analyser: the
# question it answers — what did we waste — is a review question, not a
# monitoring one. Polling every few minutes would burn Langfuse's rate limit to
# produce data that is stale but not live, for a dashboard nobody watches in
# real time.
#
# For the other two moments, use the other paths:
#   investigating one bad run  → paste it, or run langfuse_sync.py locally
#   did this change make it worse → POST /api/ingest from CI and assert wasteShare
#
# Required repository secrets:
#   LANGFUSE_PUBLIC_KEY  LANGFUSE_SECRET_KEY  LANGFUSE_BASE_URL
#   RUNSCAN_ENDPOINT   RUNSCAN_API_KEY

name: Daily trace roll-up

on:
  schedule:
    - cron: "0 6 * * *"            # 06:00 UTC — yesterday's runs, before the day starts
  workflow_dispatch:               # and whenever you want it
    inputs:
      limit:
        description: "How many recent traces to consider"
        default: "50"
      min_spans:
        description: "Skip traces smaller than this"
        default: "4"
      force:
        description: "Re-send traces already seen"
        type: boolean
        default: false

concurrency:
  group: langfuse-sync             # never two syncs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      # the cursor stops every run re-sending the same traces; ingest also
      # deduplicates server-side, so a cache miss is harmless
      - name: Restore sync cursor
        uses: actions/cache@v4
        with:
          path: .runscan-sync.json
          key: runscan-sync-${{ github.run_id }}
          restore-keys: runscan-sync-

      - name: Sync
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL:   ${{ secrets.LANGFUSE_BASE_URL }}
          RUNSCAN_ENDPOINT:  ${{ secrets.RUNSCAN_ENDPOINT }}
          RUNSCAN_API_KEY:   ${{ secrets.RUNSCAN_API_KEY }}
          RUNSCAN_SYNC_STATE: .runscan-sync.json
        run: |
          python integrations/python/langfuse_sync.py \
            --limit "${{ inputs.limit || 100 }}" \
            --min-spans "${{ inputs.min_spans || 4 }}" \
            --sleep 1.0 \
            ${{ inputs.force == 'true' && '--force' || '' }}
